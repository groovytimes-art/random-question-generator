<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Random Question Generator</title>
  <link rel="stylesheet" href="styles.css">
</head>

<body>

  <main class="container">

    <h1>Random Question Generator</h1>

    <div id="question-card">
      <p id="category" class="category"></p>
      <p id="question" class="question">Loading questions...</p>
    </div>

    <div class="controls">
      <button id="new-btn">Click for Question</button>
    </div>

    <img src="duck.gif" alt="Duck" id="duck">

  </main>

  <script src="script.js"></script>

</body>
</html>
